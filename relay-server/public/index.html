<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrcpy 远程控制</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: #2c3e50;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 24px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .mobile-device-btn {
            display: none;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: #4f6df1;
            cursor: pointer;
        }

        .mobile-close-btn {
            display: none;
            border: none;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 12px;
            color: #d7e4ff;
            background: rgba(255, 255, 255, 0.16);
            cursor: pointer;
        }

        .mobile-drawer-backdrop {
            display: none;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .username {
            color: #ecf0f1;
            font-size: 14px;
        }
        
        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
        }
        
        .logout-btn:hover {
            background: #c0392b;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
            animation: pulse 2s infinite;
        }
        
        .status-dot.connected {
            background: #2ecc71;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .main-content {
            display: flex;
            height: calc(100vh - 140px);
        }
        
        .sidebar {
            width: 300px;
            background: #34495e;
            color: white;
            padding: 20px;
            overflow-y: auto;
        }
        
        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .sidebar-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .device-list {
            list-style: none;
            display: block;
        }
        
        .device-item {
            background: #2c3e50;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            display: grid;
            grid-template-columns: 120px minmax(0, 1fr);
            align-items: center;
            gap: 12px;
        }
        
        .device-item:hover {
            background: #1a252f;
            transform: translateX(5px);
        }
        
        .device-item.selected {
            border-color: #667eea;
            background: #1a252f;
        }
        
        .device-thumbnail {
            width: 120px;
            height: 80px;
            background: #1a252f;
            border-radius: 4px;
            object-fit: contain;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .device-details {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .device-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        
        .device-name {
            font-weight: bold;
            font-size: 14px;
            line-height: 1.3;
            width: 100%;
            min-width: 0;
            white-space: normal;
            word-break: break-word;
        }
        
        .edit-name-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            flex-shrink: 0;
        }
        
        .edit-name-btn:hover {
            background: #5568d3;
        }

        .group-btn {
            background: #0f9d8a;
        }

        .group-btn:hover {
            background: #0b7f70;
        }

        .device-group-block {
            margin-bottom: 12px;
        }

        .device-group-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 6px 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            font-size: 12px;
            font-weight: 600;
            color: #d4e0ff;
        }

        .device-group-count {
            color: #a9b7d8;
            font-size: 11px;
        }

        .device-group-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .device-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            margin-top: 5px;
        }
        
        .device-status.ready {
            background: #3498db;
            color: white;
        }
        
        .device-status.streaming {
            background: #2ecc71;
            color: white;
        }
        
        .viewer {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ecf0f1;
            min-width: 0;
        }
        
        .video-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }
        
        #videoCanvas {
            display: block !important;
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain;
            cursor: pointer;
            margin: auto;
        }
        
        .no-device {
            color: #95a5a6;
            text-align: center;
            font-size: 18px;
        }
        
        .controls {
            background: white;
            padding: 15px 30px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #ddd;
            flex-shrink: 0;
            min-height: 60px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn.danger {
            background: #e74c3c;
        }
        
        .btn.danger:hover {
            background: #c0392b;
        }
        
        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            animation: fadeIn 0.3s;
        }
        
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            animation: slideIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        
        .modal-body {
            margin-bottom: 20px;
        }
        
        .modal-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .modal-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .modal-btn.primary {
            background: #667eea;
            color: white;
        }
        
        .modal-btn.primary:hover {
            background: #5568d3;
        }
        
        .modal-btn.secondary {
            background: #95a5a6;
            color: white;
        }
        
        .modal-btn.secondary:hover {
            background: #7f8c8d;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 900px) {
            body {
                padding: 0;
                background: radial-gradient(circle at 20% 10%, #6b8eff 0%, #2d3857 45%, #151b2b 100%);
                min-height: 100dvh;
            }

            .container {
                max-width: none;
                min-height: 100dvh;
                border-radius: 0;
                box-shadow: none;
                background: #0f1525;
            }

            .header {
                position: sticky;
                top: 0;
                z-index: 20;
                padding: 10px 12px;
                background: rgba(17, 24, 39, 0.96);
                backdrop-filter: blur(10px);
            }

            .header h1 {
                font-size: 15px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .mobile-device-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .user-info {
                gap: 8px;
            }

            .status {
                gap: 6px;
                font-size: 12px;
            }

            .status-dot {
                width: 9px;
                height: 9px;
            }

            .username {
                font-size: 12px;
                max-width: 70px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .logout-btn {
                padding: 6px 10px;
                font-size: 12px;
            }

            .main-content {
                height: calc(100dvh - 58px);
            }

            .viewer {
                background: #0f1525;
                padding: 8px 8px calc(env(safe-area-inset-bottom) + 78px);
            }

            .video-container {
                border-radius: 14px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                background: #000;
            }

            .sidebar {
                position: fixed;
                top: 58px;
                left: 0;
                bottom: 0;
                width: min(88vw, 360px);
                z-index: 31;
                transform: translateX(-105%);
                transition: transform 0.22s ease;
                padding: 14px;
                background: linear-gradient(180deg, #1e2c45 0%, #162238 100%);
                border-right: 1px solid rgba(255, 255, 255, 0.12);
            }

            body.mobile-sidebar-open .sidebar {
                transform: translateX(0);
            }

            .mobile-close-btn {
                display: inline-block;
            }

            .sidebar h2 {
                margin-bottom: 10px;
                padding-bottom: 0;
                border-bottom: none;
            }

            .device-item {
                display: grid;
                grid-template-columns: 92px minmax(0, 1fr);
                align-items: center;
                border-radius: 10px;
                padding: 9px;
                margin-bottom: 8px;
            }

            .device-item:hover {
                transform: none;
            }

            .device-thumbnail {
                width: 92px;
                height: 62px;
            }

            .device-name {
                font-size: 13px;
            }

            .edit-name-btn {
                font-size: 10px;
                padding: 3px 7px;
            }

            .device-actions {
                gap: 5px;
            }

            .device-group-title {
                font-size: 11px;
                padding: 5px 7px;
            }

            .controls {
                display: flex;
                position: fixed;
                left: 8px;
                right: 8px;
                bottom: calc(env(safe-area-inset-bottom) + 8px);
                z-index: 22;
                min-height: auto;
                padding: 8px;
                border-radius: 12px;
                border: 1px solid rgba(255, 255, 255, 0.16);
                background: rgba(16, 24, 40, 0.82);
                backdrop-filter: blur(8px);
                overflow-x: auto;
                gap: 6px;
                scrollbar-width: none;
            }

            .controls::-webkit-scrollbar {
                display: none;
            }

            .btn {
                flex: 0 0 auto;
                min-width: 74px;
                padding: 8px 10px;
                border-radius: 9px;
                font-size: 11px;
            }

            .no-device {
                font-size: 15px;
                padding: 0 14px;
            }

            .loading {
                font-size: 14px;
            }

            .spinner {
                width: 30px;
                height: 30px;
                border-width: 3px;
            }

            .mobile-drawer-backdrop {
                position: fixed;
                top: 58px;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 30;
                background: rgba(0, 0, 0, 0.38);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s ease;
                display: block;
            }

            body.mobile-sidebar-open .mobile-drawer-backdrop {
                opacity: 1;
                pointer-events: auto;
            }

            .modal-content {
                width: calc(100% - 24px);
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <button class="mobile-device-btn" id="openDevicePanelBtn" type="button">📱 设备</button>
                <h1>🎮 Scrcpy 远程控制系统</h1>
            </div>
            <div class="user-info">
                <div class="status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">未连接</span>
                </div>
                <span class="username" id="username">用户</span>
                <button class="logout-btn" id="logoutBtn">退出登录</button>
            </div>
        </div>

        <div class="mobile-drawer-backdrop" id="mobileDrawerBackdrop"></div>
        
        <div class="main-content">
            <div class="sidebar">
                <div class="sidebar-title-row">
                    <h2>📱 可用设备</h2>
                    <button class="mobile-close-btn" id="closeDevicePanelBtn" type="button">收起</button>
                </div>
                <ul class="device-list" id="deviceList">
                    <li class="no-device">等待控制台连接...</li>
                </ul>
                <div style="margin-top: 15px; padding: 10px; background: #2c3e50; border-radius: 5px; font-size: 12px;">
                    <div>📊 统计信息</div>
                    <div id="statsInfo" style="color: #95a5a6; margin-top: 5px;">控制台: 0 | 设备: 0</div>
                </div>
            </div>
            
            <div class="viewer">
                <div class="video-container" id="videoContainer">
                    <canvas id="videoCanvas"></canvas>
                    <div class="no-device" id="noDevice">请从左侧选择一个设备</div>
                    <div class="loading" id="loading" style="display: none;">
                        <div class="spinner"></div>
                        <div>正在连接...</div>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="btn" onclick="sendControl('home')">🏠 主页</button>
                    <button class="btn" onclick="sendControl('back')">⬅️ 返回</button>
                    <button class="btn" onclick="sendControl('recent')">📋 最近任务</button>
                    <button class="btn" onclick="sendControl('rotate')">🔄 旋转</button>
                    <button class="btn" onclick="sendControl('power')">🔌 电源</button>
                    <button class="btn" onclick="sendControl('volumeUp')">🔊 音量+</button>
                    <button class="btn" onclick="sendControl('volumeDown')">🔉 音量-</button>
                    <button class="btn danger" onclick="disconnect()">❌ 断开连接</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 修改设备名称模态框 -->
    <div id="editNameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">修改设备名称</div>
            <div class="modal-body">
                <input type="text" id="deviceNameInput" class="modal-input" placeholder="输入设备名称" maxlength="50">
            </div>
            <div class="modal-footer">
                <button class="modal-btn secondary" onclick="closeEditNameModal()">取消</button>
                <button class="modal-btn primary" onclick="saveDeviceName()">保存</button>
            </div>
        </div>
    </div>

    <div id="editGroupModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">设置设备分组</div>
            <div class="modal-body">
                <input type="text" id="deviceGroupInput" class="modal-input" placeholder="输入分组名，留空表示未分组" maxlength="40">
            </div>
            <div class="modal-footer">
                <button class="modal-btn secondary" onclick="closeEditGroupModal()">取消</button>
                <button class="modal-btn primary" onclick="saveDeviceGroup()">保存</button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
