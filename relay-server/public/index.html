<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrcpy 远程控制</title>
    <link rel="stylesheet" href="responsive.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: #2c3e50;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 24px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .username {
            color: #ecf0f1;
            font-size: 14px;
        }
        
        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
        }
        
        .logout-btn:hover {
            background: #c0392b;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
            animation: pulse 2s infinite;
        }
        
        .status-dot.connected {
            background: #2ecc71;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .main-content {
            display: flex;
            height: calc(100vh - 140px);
        }
        
        .sidebar {
            width: 300px;
            background: #34495e;
            color: white;
            padding: 20px;
            overflow-y: auto;
        }
        
        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .device-list {
            list-style: none;
        }
        
        .device-item {
            background: #2c3e50;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .device-item:hover {
            background: #1a252f;
            transform: translateX(5px);
        }
        
        .device-item.selected {
            border-color: #667eea;
            background: #1a252f;
        }
        
        .device-thumbnail {
            width: 120px;
            height: 80px;
            background: #1a252f;
            border-radius: 4px;
            object-fit: contain;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .device-details {
            flex: 1;
            min-width: 0;
        }
        
        .device-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }
        
        .device-name {
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        
        .edit-name-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            flex-shrink: 0;
        }
        
        .edit-name-btn:hover {
            background: #5568d3;
        }
        
        .device-info {
            font-size: 12px;
            color: #95a5a6;
        }
        
        .device-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            margin-top: 5px;
        }
        
        .device-status.ready {
            background: #3498db;
            color: white;
        }
        
        .device-status.streaming {
            background: #2ecc71;
            color: white;
        }
        
        .viewer {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ecf0f1;
            min-width: 0;
        }
        
        .video-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }
        
        #videoCanvas {
            display: block !important;
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain;
            cursor: pointer;
            margin: auto;
        }
        
        .no-device {
            color: #95a5a6;
            text-align: center;
            font-size: 18px;
        }
        
        .controls {
            background: white;
            padding: 15px 30px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #ddd;
            flex-shrink: 0;
            min-height: 60px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn.danger {
            background: #e74c3c;
        }
        
        .btn.danger:hover {
            background: #c0392b;
        }
        
        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            animation: fadeIn 0.3s;
        }
        
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            animation: slideIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        
        .modal-body {
            margin-bottom: 20px;
        }
        
        .modal-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .modal-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .modal-btn.primary {
            background: #667eea;
            color: white;
        }
        
        .modal-btn.primary:hover {
            background: #5568d3;
        }
        
        .modal-btn.secondary {
            background: #95a5a6;
            color: white;
        }
        
        .modal-btn.secondary:hover {
            background: #7f8c8d;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Scrcpy 远程控制系统</h1>
            <div class="user-info">
                <div class="status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">未连接</span>
                </div>
                <span class="username" id="username">用户</span>
                <button class="logout-btn" id="logoutBtn">退出登录</button>
            </div>
        </div>
        
        <div class="main-content">
            <div class="sidebar">
                <h2>📱 可用设备</h2>
                <ul class="device-list" id="deviceList">
                    <li class="no-device">等待控制台连接...</li>
                </ul>
                <div style="margin-top: 15px; padding: 10px; background: #2c3e50; border-radius: 5px; font-size: 12px;">
                    <div>📊 统计信息</div>
                    <div id="statsInfo" style="color: #95a5a6; margin-top: 5px;">控制台: 0 | 设备: 0</div>
                </div>
            </div>
            
            <div class="viewer">
                <div class="video-container" id="videoContainer">
                    <canvas id="videoCanvas"></canvas>
                    <div class="no-device" id="noDevice">请从左侧选择一个设备</div>
                    <div class="loading" id="loading" style="display: none;">
                        <div class="spinner"></div>
                        <div>正在连接...</div>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="btn" onclick="sendControl('home')">🏠 主页</button>
                    <button class="btn" onclick="sendControl('back')">⬅️ 返回</button>
                    <button class="btn" onclick="sendControl('recent')">📋 最近任务</button>
                    <button class="btn" onclick="sendControl('power')">🔌 电源</button>
                    <button class="btn" onclick="sendControl('volumeUp')">🔊 音量+</button>
                    <button class="btn" onclick="sendControl('volumeDown')">🔉 音量-</button>
                    <button class="btn danger" onclick="disconnect()">❌ 断开连接</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 修改设备名称模态框 -->
    <div id="editNameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">修改设备名称</div>
            <div class="modal-body">
                <input type="text" id="deviceNameInput" class="modal-input" placeholder="输入设备名称" maxlength="50">
            </div>
            <div class="modal-footer">
                <button class="modal-btn secondary" onclick="closeEditNameModal()">取消</button>
                <button class="modal-btn primary" onclick="saveDeviceName()">保存</button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
